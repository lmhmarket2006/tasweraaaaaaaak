[build]
builder = "nixpacks"
# لا تشغّل migrate أثناء البناء — DATABASE_URL غالباً غير متاح هناك على Railway
buildCommand = "npm run build"

[deploy]
# تشغيل migrations عند بدء التشغيل عندما تكون قاعدة البيانات متصلة
startCommand = "npx prisma migrate deploy && npm run start"
restartPolicyType = "on_failure"
